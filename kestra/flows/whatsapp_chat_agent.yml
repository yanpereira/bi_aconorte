id: whatsapp_chat_agent
namespace: aconorte

# ── Documentação ──────────────────────────────────────────────────────────────
# Flow passivo: só executa quando a Evolution API envia uma mensagem.
# URL do webhook (configure na Evolution API):
#   https://<seu-kestra>.easypanel.host/api/v1/executions/webhook/aconorte/whatsapp_chat_agent/aconorte_webhook_2024
# ─────────────────────────────────────────────────────────────────────────────

triggers:
  - id: evolution_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: aconorte_webhook_2024   # mesmo valor do WEBHOOK_TOKEN no .env

tasks:

  # ── 1. Valida payload e lê KPIs do MinIO ──────────────────────────────────
  - id: process_message
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    beforeCommands:
      - pip install --quiet anthropic minio requests
    env:
      ANTHROPIC_API_KEY: "{{ kv('ANTHROPIC_API_KEY') }}"
      MINIO_ENDPOINT: "elt-minio.xbgiwf.easypanel.host"
      MINIO_ACCESS_KEY: "admin"
      MINIO_SECRET_KEY: "password"
      MINIO_BUCKET: "aconorte"
      EVOLUTION_API_URL: "https://elt-evolution-api.xbgiwf.easypanel.host"
      EVOLUTION_API_KEY: "429683C4C977415CAAFCCE10F7D57E11"
      EVOLUTION_INSTANCE: "api_ia"
      RECIPIENTS: "5588999588269,5588992239602,5585992163703"
    inputFiles:
      payload.json: "{{ trigger.body }}"
    script: |
      import json, os, sys
      from kestra import Kestra

      # ── Parse do payload da Evolution API ───────────────────────────────
      with open("payload.json") as f:
          payload = json.load(f)

      event = payload.get("event", "")
      if event != "messages.upsert":
          Kestra.outputs({"status": "ignored", "remote_jid": "", "reply": ""})
          sys.exit(0)

      data    = payload.get("data", {})
      key     = data.get("key", {})
      message = data.get("message", {})

      if key.get("fromMe"):
          Kestra.outputs({"status": "ignored", "remote_jid": "", "reply": ""})
          sys.exit(0)

      remote_jid = key.get("remoteJid", "")
      sender     = remote_jid.split("@")[0]
      authorized = set(os.environ["RECIPIENTS"].split(","))

      if sender not in authorized:
          Kestra.outputs({"status": "ignored", "remote_jid": "", "reply": ""})
          sys.exit(0)

      text = (
          message.get("conversation")
          or message.get("extendedTextMessage", {}).get("text")
          or ""
      ).strip()

      if not text:
          Kestra.outputs({"status": "ignored", "remote_jid": "", "reply": ""})
          sys.exit(0)

      print(f"Mensagem de {sender}: {text[:80]}")

      # ── KPIs do MinIO ───────────────────────────────────────────────────
      from minio import Minio
      from minio.error import S3Error

      def fmt_currency(v):
          if v is None: return "—"
          return f"R$ {float(v):,.2f}".replace(",","X").replace(".","," ).replace("X",".")

      def fmt_pct(v):
          if v is None: return "—"
          return f"{float(v)*100:.2f}%".replace(".",",")

      minio_client = Minio(
          os.environ["MINIO_ENDPOINT"],
          access_key=os.environ["MINIO_ACCESS_KEY"],
          secret_key=os.environ["MINIO_SECRET_KEY"],
          secure=True,
      )
      bucket = os.environ["MINIO_BUCKET"]

      kpis = {}
      # Tenta sequência de nomes de arquivo
      candidates = ["kpis.json", "vendas.json", "latest.json"]
      for name in candidates:
          try:
              resp = minio_client.get_object(bucket, name)
              kpis = json.loads(resp.read().decode("utf-8"))
              resp.close()
              print(f"KPIs lidos de {name}")
              break
          except S3Error:
              continue

      # Formata contexto para o Claude
      vendas    = kpis.get("vendas", {})
      estoque   = kpis.get("estoque", {})
      financeiro= kpis.get("financeiro", {})

      contexto = f"""=== VENDAS (mês atual) ===
      Faturamento:       {fmt_currency(vendas.get('vlr_vendas'))}
      Meta:              {fmt_currency(vendas.get('vlr_meta'))}
      Restante meta:     {fmt_currency(vendas.get('vlr_restante_meta'))}
      Margem bruta:      {fmt_pct(vendas.get('pct_margem_bruta'))}
      Ticket médio:      {fmt_currency(vendas.get('vlr_ticket_medio'))}
      Transações:        {vendas.get('qtd_transacoes')}
      Clientes ativos:   {vendas.get('qtd_clientes')}

      === ESTOQUE ===
      Saldo total:           {estoque.get('saldo_estoque_geral')}
      Valor compra:          {fmt_currency(estoque.get('vlr_estoque_compra'))}
      Valor venda:           {fmt_currency(estoque.get('vlr_estoque_venda'))}
      Prod. estoque negativo:{estoque.get('qtd_prod_estoque_negativo')}
      Prod. zerados:         {estoque.get('qtd_prod_estoque_zerado')}
      Sem venda +90d:        {estoque.get('qtd_prod_sem_venda_mais_90d')}

      === FINANCEIRO ===
      Saldo caixa:    {fmt_currency(financeiro.get('vlr_saldo_caixa'))}
      Entradas:       {fmt_currency(financeiro.get('vlr_credito'))}
      Saídas:         {fmt_currency(financeiro.get('vlr_debito'))}
      Contas a pagar: {fmt_currency(financeiro.get('contas_a_pagar'))}
      Contas a receber:{fmt_currency(financeiro.get('contas_a_receber'))}
      """ if kpis else "Dados do BI indisponíveis no momento."

      # ── Gera resposta com Claude ─────────────────────────────────────────
      import anthropic

      claude = anthropic.Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])

      system = """Você é o assistente de BI da Aço Norte, distribuidora de aços do Ceará.
      Responda em português do Brasil, de forma direta e amigável para WhatsApp.

      Regras de formatação:
      - Não use markdown (sem **, ##, ---) — WhatsApp não renderiza
      - Use emojis com moderação
      - Valores monetários: R$ 1.234,56 | Percentuais: 12,34%
      - Máximo 60 caracteres por linha

      == MODELO DE NEGÓCIO DA ACO NORTE ==

      A Aço Norte é uma distribuidora de aços do Ceará. O BI possui 4 pilares:
      Vendas, Estoque/Movimentações, Financeiro e Pedidos de Compra.

      MÉTRICAS DE VENDAS:
      - vlr_vendas: faturamento bruto (soma de vlr_venda_total)
      - vlr_margem_bruta: faturamento menos custo (lucro bruto em R$)
      - %_margem_bruta: margem dividida pelo faturamento
      - vlr_ticket_medio: faturamento ÷ número de notas/pedidos
      - vlr_meta: meta mensal de faturamento (tabela Metas)
      - vlr_restante_meta: quanto falta para a meta (negativo = superou)
      - qtd_transacoes: número de notas/pedidos distintos
      - qtd_clientes: clientes distintos que compraram
      - Faturamento Mês Anterior / Ano Anterior: comparativos temporais

      MÉTRICAS DE ESTOQUE:
      - saldo_estoque_geral: posição atual em quantidade
      - vlr_estoque (compra): estoque valorado pelo preço de compra
      - vlr_estoque_vendas: estoque valorado pelo preço de venda
      - qtd_produtos_estoque_negativo: inconsistência / venda a descoberto
      - qtd_produtos_estoque_zerado: ruptura de estoque
      - Sem venda 30-60d / 60-90d / +90d: faixas de produtos parados
      - situacao_abastecer_estoque: "Comprar urgentemente" (< 2 meses sem pedido),
        "Comprar quando possível" (≥ 2 meses sem pedido),
        "Aguardando recebimento" (pedido aberto),
        "Verificar real situação" (estoque negativo)
      - qtd_meses_capacidade_estoque: meses de cobertura = (estoque + pedidos) ÷ venda média mensal

      MÉTRICAS FINANCEIRAS:
      - vlr_credito: entradas de caixa (tipo C, efetivadas)
      - vlr_debito: saídas de caixa (tipo D, efetivadas)
      - vlr_saldo_caixa: créditos − débitos
      - contas_a_pagar: débitos em aberto (status A)
      - contas_a_receber: créditos em aberto (status A)
      - cmv_compra: Custo das Mercadorias Vendidas = EI + Compras − EF (pelo preço de compra)
      - vlr_compras_mes: total de NFs de entrada (compras) no mês

      PEDIDOS DE COMPRA:
      - qtd_pedidos_comprados: quantidade total em aberto nos pedidos
      - qtd_pedidos_recebidos: quantidade já recebida
      - ultimo_preco: último preço de compra pago pelo produto

      REGRAS DE NEGÓCIO:
      - Meta: positivo = falta vender, negativo = superou
      - Margem saudável é definida pelo parâmetro par_percent_margem
      - Produtos com > 90 dias sem venda são críticos (capital parado)
      - fat_caixa status 'E' = efetivado, 'A' = aberto/pendente
      - Movimentos estoque: tipo_movimento 'E' + stMov 'E' = entrada efetiva

      == DADOS ATUAIS DO BI ==
      """ + contexto

      response = claude.messages.create(
          model="claude-sonnet-4-6",
          max_tokens=512,
          system=system,
          messages=[{"role": "user", "content": text}],
      )
      reply = response.content[0].text
      print(f"Resposta gerada ({len(reply)} chars)")

      Kestra.outputs({
          "status": "replied",
          "remote_jid": remote_jid,
          "reply": reply,
      })

  # ── 2. Envia resposta via Evolution API (só se houve resposta) ─────────────
  - id: send_reply
    type: io.kestra.plugin.core.http.Request
    runIf: "{{ outputs.process_message.vars.status == 'replied' }}"
    uri: "https://elt-evolution-api.xbgiwf.easypanel.host/message/sendText/api_ia"
    method: POST
    headers:
      apikey: "429683C4C977415CAAFCCE10F7D57E11"
      Content-Type: application/json
    body: |
      {
        "number": "{{ outputs.process_message.vars.remote_jid }}",
        "text": {{ outputs.process_message.vars.reply | json }},
        "delay": 1200
      }
